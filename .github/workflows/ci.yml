name: LEMMA CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest

      # No ANTHROPIC_API_KEY and no network are provided on purpose. The suite
      # injects deterministic fake embedders (real FastEmbed would pull ~100MB
      # of weights) and stubs the Anthropic client, so a green run here proves
      # the tests are genuinely hermetic. If a test ever starts needing a key,
      # this job fails — which is the correct outcome, not an inconvenience: a
      # suite that quietly depends on credentials cannot run in CI at all, and
      # the day it starts is the day you want to know.
      - name: Test suite
        run: python -m pytest -q
